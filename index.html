<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>試験アプリ</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<button id="homeButton"
onclick="goHome()">
🏠
</button>

<div class="container">

<!-- 画面1 -->
<div id="page1">

<h1>試験アプリ</h1>

<h2>出題モード</h2>

<button onclick="selectMode('normal')">
順番に出題
</button>

<button onclick="selectMode('random')">
ランダム出題
</button>

<button onclick="selectMode('weak')">
苦手問題
</button>

</div>

<!-- 画面2 -->
<div id="page2" class="hidden">

<h2>問題数を選択</h2>

<button onclick="startQuiz(5)">
5問
</button>

<button onclick="startQuiz(10)">
10問
</button>

<button onclick="startQuiz(20)">
20問
</button>

</div>

<!-- 画面3 -->
<div id="page3" class="hidden">

<p id="progress"></p>

<h2 id="question"></h2>

<p id="history"></p>

<div id="choices"></div>

<p id="result"></p>

</div>

<!-- 終了画面 -->
<div id="finishPage"
class="hidden">

<h2>結果</h2>

<p id="finalResult"></p>

<button onclick="goHome()">
トップへ戻る
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
