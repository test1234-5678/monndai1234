<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>試験アプリ</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<!-- トップ画面 -->

<div id="topPage">

<h1>試験アプリ</h1>

<p id="progressRate">
進捗率：0%
</p>

<div class="progressBar">

<div id="progressFill">

</div>

</div>

<h2>出題モード</h2>

<button id="mode-normal"
onclick="setMode('normal')">
順番に出題
</button>

<button id="mode-random"
onclick="setMode('random')">
ランダム出題
</button>

<button id="mode-weak"
onclick="setMode('weak')">
苦手問題
</button>

<h2>問題数</h2>

<div class="countArea">

<button id="count-5"
onclick="setCount(5)">
5問
</button>

<button id="count-10"
onclick="setCount(10)">
10問
</button>

<button id="count-20"
onclick="setCount(20)">
20問
</button>

</div>

<p id="settingsText">
順番 / 5問
</p>

<button onclick="startQuiz()">
開始
</button>

<div id="scoreBoard" style="text-align:center; font-weight:bold; font-size:18px; line-height:1.6;">
  <div id="row1"></div>
  <div id="row2"></div>
</div>

<button onclick="showPage('listPage')">
問題一覧
</button>

</div>

<!-- 問題画面 -->

<div id="quizPage"
class="hidden">

<p id="progress"></p>

<h3 id="questionNumber"></h3>

<h2 id="question"></h2>

<p id="history"></p>

<div id="choices"></div>

<p id="result"></p>

<div class="bottomButtons">

<button onclick="prevQuestion()">
戻る
</button>

<button onclick="goHome()">
ホーム
</button>

<button onclick="nextQuestion()">
次へ
</button>

</div>

</div>

<!-- 問題一覧画面 -->

<div id="listPage"
class="hidden">

<h2>問題一覧</h2>

<div id="questionList">

</div>

<button onclick="goHome()">
ホーム
</button>

</div>

<!-- 結果画面 -->

<div id="finishPage"
class="hidden">

<h2>結果</h2>

<p id="finalResult"></p>

<button onclick="goHome()">
ホーム
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
